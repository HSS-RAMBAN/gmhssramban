  </head>
  <body>
    <div id="root"></div>
    <!-- Startup loading animation — removed automatically when React mounts -->
    <div id="app-loader" class="app-loader">
      <div class="app-loader__crest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5 L21 7.5 L12 11.5 L3 7.5 Z" />
          <path d="M6 10 V14.5 C6 14.5 9 16.5 12 16.5 C15 16.5 18 14.5 18 14.5 V10" />
          <path d="M21 7.5 V13" />
        </svg>
      </div>
      <div class="app-loader__dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <style>
      .app-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:#2e1065;transition:opacity .4s ease,visibility .4s ease;}
      .app-loader--hidden{opacity:0;visibility:hidden;}
      .app-loader__crest{color:#c4b5fd;animation:app-loader-pulse 1.8s ease-in-out infinite;}
      .app-loader__crest svg{width:3rem;height:3rem;}
      .app-loader__dots{display:flex;gap:.5rem;}
      .app-loader__dots span{width:6px;height:6px;border-radius:9999px;background:#a78bfa;opacity:.25;animation:app-loader-dot 1.4s ease-in-out infinite;}
      .app-loader__dots span:nth-child(1){animation-delay:0s;}
      .app-loader__dots span:nth-child(2){animation-delay:.18s;}
      .app-loader__dots span:nth-child(3){animation-delay:.36s;}
      @keyframes app-loader-pulse{0%,100%{opacity:.5;transform:scale(.96);}50%{opacity:1;transform:scale(1);}}
      @keyframes app-loader-dot{0%,100%{opacity:.25;transform:translateY(0);}50%{opacity:1;transform:translateY(-4px);}}
      @media (prefers-reduced-motion:reduce){.app-loader__crest,.app-loader__dots span{animation-duration:.001ms;}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
